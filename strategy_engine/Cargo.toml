[package]
name = "strategy_engine"
version = "0.1.0"
edition = "2021"
# Minimum supported toolchain. Must stay <= the channel in //rust-toolchain.toml.
rust-version = "1.99"

[lib]
# staticlib: linked into the C++ engine. rlib: lets the integration tests in
# tests/ link the crate and call the extern "C" entry points directly.
crate-type = ["staticlib", "rlib"]

[dependencies]
prost = "0.14"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
