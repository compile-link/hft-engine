version: 2

updates:
  # Rust crates, pinned by strategy_engine/Cargo.lock.
  - package-ecosystem: cargo
    directory: /strategy_engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR for routine patch/minor bumps; majors stay separate so they get
      # reviewed on their own.
      cargo-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions. Actions are pinned to commit SHAs, which Dependabot
  # understands and updates, keeping the "# vX.Y.Z" comment in step.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-build-env
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: [major, minor, patch]

  # Base image in the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps)"

# Not covered by Dependabot:
#   - vcpkg.json "builtin-baseline": no ecosystem support. Bump by hand with
#     scripts/update-vcpkg-baseline.sh and let CI verify the result.
#   - rust-toolchain.toml: the Rust toolchain version is deliberately manual.
