version: 2

updates:
  # Rust crates, pinned by strategy_engine/Cargo.lock.
  - package-ecosystem: cargo
    directory: /strategy_engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # prost-build generates the code that prost deserializes at runtime, so
      # the two have to move together; a bump to one alone can leave the
      # generated code and the runtime on incompatible versions. #20 and #21
      # arrived split exactly that way. Grouped for every update type,
      # including majors, because a major is precisely when the generated
      # code changes. Listed first and excluded from the catch-all below, so
      # the pairing holds whichever group Dependabot considers first.
      prost:
        patterns:
          - prost
          - prost-*
        update-types: [major, minor, patch]

      # One PR for routine patch/minor bumps; majors stay separate so they get
      # reviewed on their own.
      cargo-minor-patch:
        exclude-patterns:
          - prost
          - prost-*
        update-types: [minor, patch]

  # GitHub Actions. Actions are pinned to commit SHAs, which Dependabot
  # understands and updates, keeping the "# vX.Y.Z" comment in step.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-build-env
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: [major, minor, patch]

  # Base image in the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps)"

# Not covered by Dependabot:
#   - vcpkg.json "builtin-baseline": no ecosystem support. Bump by hand with
#     scripts/update-vcpkg-baseline.sh and let CI verify the result.
#   - rust-toolchain.toml: the Rust toolchain version is deliberately manual.
