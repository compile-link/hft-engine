name: Set up build environment
description: >
  Installs the pinned Rust toolchain and checks out vcpkg at the baseline
  recorded in vcpkg.json, with a cached binary store for built dependencies.

inputs:
  cache-key:
    description: Extra component for the vcpkg binary cache key (e.g. the preset).
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install && rustc --version && cargo --version

    - name: Cache cargo registry and build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          strategy_engine/target
        key: cargo-${{ inputs.cache-key }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'strategy_engine/Cargo.lock') }}
        restore-keys: cargo-${{ inputs.cache-key }}-${{ runner.os }}-

    - name: Read vcpkg baseline
      id: baseline
      shell: bash
      # The baseline is read from vcpkg.json so there is one place to bump it.
      run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"

    # The checkout plus bootstrapped vcpkg binary is cached per baseline.
    # Bootstrapping downloads the binary from GitHub Releases, which is the
    # step that failed with a 504 in a nightly run; on a cache hit it never
    # runs at all.
    - name: Restore vcpkg checkout
      id: vcpkg-checkout
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg
        key: vcpkg-tool-${{ runner.os }}-${{ steps.baseline.outputs.sha }}

    - name: Set up vcpkg at pinned baseline
      if: steps.vcpkg-checkout.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASELINE: ${{ steps.baseline.outputs.sha }}
      run: |
        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        echo "vcpkg baseline: $BASELINE"
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" checkout --quiet "$BASELINE"
        # The bootstrap script's own download has no retry; wrap it so a
        # transient GitHub error does not fail the whole job.
        for attempt in 1 2 3 4; do
          if "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; then
            break
          fi
          if [[ "$attempt" -eq 4 ]]; then
            echo "::error::vcpkg bootstrap failed after $attempt attempts"
            exit 1
          fi
          echo "vcpkg bootstrap failed (attempt $attempt), retrying in $((attempt * 15))s"
          sleep $((attempt * 15))
        done

    - name: Export vcpkg environment
      shell: bash
      run: |
        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        VCPKG_ARCHIVES="$RUNNER_TEMP/vcpkg-archives"
        "$VCPKG_ROOT/vcpkg" version
        mkdir -p "$VCPKG_ARCHIVES"
        {
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_ARCHIVES=$VCPKG_ARCHIVES"
          echo "VCPKG_DISABLE_METRICS=1"
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_ARCHIVES,readwrite"
        } >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.VCPKG_ARCHIVES }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ runner.os }}-
