name: Set up build environment
description: >
  Installs the pinned Rust toolchain and sets up vcpkg at the baseline
  recorded in vcpkg.json (scripts/setup-vcpkg.sh), with a cached binary
  store for built dependencies.

inputs:
  cargo-cache:
    description: >
      Which cargo build this job runs, so jobs that build the same thing share
      one cache: "release" for anything that builds through CMake (always
      cargo build --release), "lint" for clippy and cargo test (dev profile).
      Empty for jobs that do not build Rust; no cargo cache is used then.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install && rustc --version && cargo --version

    # Only what cargo cannot cheaply recreate: the registry index and the
    # downloaded .crate files (not registry/src, which cargo re-extracts from
    # them), git dependencies, and target/.
    #
    # No restore-keys, on purpose. A hit on the exact key is never re-saved,
    # but a fallback restore of an older target/ is, with every artifact cargo
    # no longer uses still inside: the cache grew 50 -> 58 -> 75 MB over three
    # Cargo.lock versions that way. The price of an exact key is one cold
    # dependency build (well under a minute) when Cargo.lock or the toolchain
    # changes.
    - name: Cache cargo downloads and build artifacts
      if: inputs.cargo-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          strategy_engine/target
        key: cargo-${{ inputs.cargo-cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'strategy_engine/Cargo.lock') }}

    - name: Read vcpkg baseline
      id: baseline
      shell: bash
      run: echo "sha=$(scripts/setup-vcpkg.sh --baseline)" >> "$GITHUB_OUTPUT"

    # The bootstrapped checkout is cached per baseline, so the bootstrap
    # download (which has failed with a 504 before) normally does not run.
    - name: Restore vcpkg checkout
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg
        key: vcpkg-tool-${{ runner.os }}-${{ steps.baseline.outputs.sha }}

    # Same script as local builds and the Dockerfile. On a cache hit it only
    # verifies the checkout.
    - name: Set up vcpkg at pinned baseline
      shell: bash
      run: scripts/setup-vcpkg.sh --root "$RUNNER_TEMP/vcpkg"

    - name: Export vcpkg environment
      shell: bash
      run: |
        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        VCPKG_ARCHIVES="$RUNNER_TEMP/vcpkg-archives"
        mkdir -p "$VCPKG_ARCHIVES"
        {
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_ARCHIVES=$VCPKG_ARCHIVES"
          echo "VCPKG_DISABLE_METRICS=1"
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_ARCHIVES,readwrite"
        } >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.VCPKG_ARCHIVES }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ runner.os }}-
