name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Version is pinned inside the script.
      - run: scripts/format.sh --check

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strategy_engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # prost-build needs protoc. The full CMake build uses the vcpkg-pinned one;
      # here the distro protoc is enough to generate code for lint and unit tests.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # Installs exactly the version from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            strategy_engine/target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'strategy_engine/Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build-test:
    name: Build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    env:
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the baseline from vcpkg.json so there is exactly one place to bump it.
      - name: Set up vcpkg at pinned baseline
        run: |
          # VCPKG_ARCHIVES holds prebuilt dependency binaries, persisted by actions/cache.
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          VCPKG_ARCHIVES="$RUNNER_TEMP/vcpkg-archives"
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          echo "vcpkg baseline: $baseline"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_ARCHIVES"
          {
            echo "VCPKG_ROOT=$VCPKG_ROOT"
            echo "VCPKG_ARCHIVES=$VCPKG_ARCHIVES"
            echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_ARCHIVES,readwrite"
          } >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_ARCHIVES }}
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-
            vcpkg-${{ runner.os }}-

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            strategy_engine/target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'strategy_engine/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
