name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Version is pinned inside the script.
      - run: scripts/format.sh --check

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version and checksum are pinned inside the script.
      - run: scripts/actionlint.sh

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strategy_engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: lint

      # prost-build shells out to protoc. Use the vcpkg-pinned one, exactly as
      # the CMake build does (see strategy_engine_build in CMakeLists.txt), so
      # the generated Rust code matches what the C++ side was built against.
      # Only the default manifest features are installed; "tests" (gtest) is
      # not needed here. Binaries come from the shared vcpkg cache.
      - name: Install pinned protoc via vcpkg
        working-directory: ${{ github.workspace }}
        run: |
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$RUNNER_TEMP/vcpkg_installed"
          protoc="$RUNNER_TEMP/vcpkg_installed/x64-linux/tools/protobuf/protoc"
          "$protoc" --version
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: tidy

      # Configure produces compile_commands.json; hft_proto generates the
      # protobuf headers that the sources include. A full build is not needed.
      - name: Configure and generate protobuf headers
        run: |
          cmake --preset debug
          cmake --build --preset debug --target hft_proto -j"$(nproc)"

      - name: Run clang-tidy on the whole tree
        env:
          TIDY_BUILD_DIR: build/debug
        run: scripts/tidy.sh

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds toolchain -> deps -> build (which runs ctest) -> runtime.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hft-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm hft-engine:ci --help
          # Replay source needs no network; confirm the pipeline actually runs.
          timeout 60 docker run --rm hft-engine:ci --source replay || rc=$?
          # 124 = killed by timeout, which is the expected outcome for a
          # long-running pipeline that was not asked to stop.
          if [[ "${rc:-0}" -ne 0 && "${rc:-0}" -ne 124 ]]; then
            echo "::error::Replay run failed with exit code ${rc}"
            exit 1
          fi

  build-test:
    name: Build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
